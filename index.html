<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedic Cosmic Simulator (Phase 10 - Triple Centric Engine)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); padding: 15px 25px; border-radius: 10px;
            box-shadow: 0 0 20px rgba(255,165,0,0.6); border: 1px solid #ffa500;
            color: white; width: 85%; max-width: 650px; text-align: center;
        }
        #info {
            position: absolute; top: 10px; left: 10px; color: #fff;
            background: rgba(0,0,0,0.75); padding: 12px; border-radius: 5px; border-left: 4px solid #ffa500;
            font-size: 13px; max-width: 360px; pointer-events: none; max-height: 80vh; overflow-y: auto;
        }
        .puri-label {
            position: absolute; color: #ffaa00; font-weight: bold; font-size: 11px;
            background: rgba(0,0,0,0.7); padding: 3px 6px; border-radius: 3px;
            border: 1px solid #ffaa00; pointer-events: none; display: none;
        }
        .live-badge {
            background: red; color: white; padding: 2px 6px; border-radius: 3px;
            font-size: 10px; font-weight: bold; display: inline-block; margin-bottom: 5px;
        }
        .view-btn {
            background: #222; border: 1px solid #ffa500; color: #ffa500; padding: 6px 12px;
            font-weight: bold; border-radius: 4px; cursor: pointer; margin: 5px; transition: all 0.3s;
        }
        .view-btn.active {
            background: #ffa500; color: black; box-shadow: 0 0 10px #ffa500;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info">
        <span class="live-badge">🔴 LIVE SYNC ACTIVE</span>
        <h3>वैदिक ब्रह्मांड क्लॉक (फेज 10)</h3>
        <p id="currentPerspective" style="color: #00ffaa; font-weight: bold; font-size: 14px;">दृष्टिकोण: भू-केन्द्रित (Geocentric)</p>
        <p id="liveClock" style="color: #ffa500; font-weight: bold; font-size: 14px; margin: 5px 0;"></p>
        <p id="ayanaState" style="color: #aaa; font-size: 12px;"></p>
        <hr style="border-color:#555;">
        <p id="nakshatraInfo">गणना चालू...</p>
        <p id="timezoneInfo" style="color: #ffaa00;"></p>
    </div>

    <div id="label-devdhani" class="puri-label">Devdhani (East)</div>
    <div id="label-samyamani" class="puri-label">🔴 Samyamani (South)</div>
    <div id="label-nimlochani" class="puri-label"> Nimlochani (West)</div>
    <div id="label-vibhavari" class="puri-label"> Vibhavari (North)</div>

    <div id="canvas-container"></div>

    <div id="controls">
        <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #ffa500;">ब्रह्मांडीय दृष्टिकोण बदलें (Change Center)</div>
        <button id="btn-geo" class="view-btn active">🌍 Geocentric</button>
        <button id="btn-sun" class="view-btn">☀️ Sun-centric</button>
        <button id="btn-polaris" class="view-btn">⭐ Polaris-centric</button>
        <div id="angleLabel" style="margin-top:5px; font-size:11px; color:#aaa;">गणना चालू...</div>
    </div>

    <script>
        // 1. Scene & Camera Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        camera.position.set(0, 60, 90);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. Starfield
        const starsGeom = new THREE.BufferGeometry();
        const starPos = new Float32Array(2500 * 3);
        for(let i=0; i<2500*3; i++) starPos[i] = (Math.random() - 0.5) * 400;
        starsGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starsGeom, new THREE.PointsMaterial({ color: 0xffffff, size: 0.25 })));

        // 3. Central Geographic Earth Map
        const textureLoader = new THREE.TextureLoader();
        const earthTex = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
        const earth = new THREE.Mesh(new THREE.SphereGeometry(4, 32, 32), new THREE.MeshBasicMaterial({ map: earthTex }));
        earth.rotation.y = Math.PI; 
        scene.add(earth);

        const meruCenterNode = new THREE.Vector3(0, 4, 0);
        
        // Dhruva Tara Node
        const polaris = new THREE.Mesh(new THREE.SphereGeometry(1.0, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        polaris.position.set(0, 45, 0); 
        scene.add(polaris);

        // 4. Puranic 4 Puris Setup
        const purisRadius = 20;
        const purisHeight = 1.0;
        const purisData = [
            { id: "devdhani", pos: new THREE.Vector3(purisRadius, purisHeight, 0), color: 0x00ffff },
            { id: "samyamani", pos: new THREE.Vector3(0, purisHeight, purisRadius), color: 0xff3333 },
            { id: "nimlochani", pos: new THREE.Vector3(-purisRadius, purisHeight, 0), color: 0x00ff00 },
            { id: "vibhavari", pos: new THREE.Vector3(0, purisHeight, -purisRadius), color: 0xffaa00 }
        ];

        purisData.forEach(p => {
            const marker = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), new THREE.MeshBasicMaterial({ color: p.color }));
            marker.position.copy(p.pos);
            scene.add(marker);
            p.mesh = marker;
        });

        // 5. Multilayered Planetary Grid Setup
        const layersConfig = [
            { name: "Surya", r: 20, h: 6, c: 0xffaa00, size: 1.6 },
            { name: "Chandra", r: 22, h: 12, c: 0xcccccc, size: 1.0 },
            { name: "Budha", r: 24, h: 17, c: 0x00ffcc, size: 0.6 },
            { name: "Mangal", r: 26, h: 22, c: 0xff4444, size: 0.8 },
            { name: "Brihaspati", r: 28, h: 27, c: 0xffd700, size: 1.2 },
            { name: "Shani", r: 30, h: 32, c: 0x551a8b, size: 1.0 }
        ];

        const grahaMeshes = {};
        layersConfig.forEach(cfg => {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(cfg.size, 16, 16), new THREE.MeshBasicMaterial({ color: cfg.c }));
            scene.add(mesh);
            grahaMeshes[cfg.name] = mesh;

            const points = [];
            for(let i=0; i<=64; i++) {
                const th = (i/64) * Math.PI * 2;
                points.push(new THREE.Vector3(cfg.r * Math.cos(th), cfg.h, cfg.r * Math.sin(th)));
            }
            scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: cfg.c, transparent: true, opacity: 0.12 })));
        });

        const axisGeom = new THREE.BufferGeometry();
        scene.add(new THREE.Line(axisGeom, new THREE.LineBasicMaterial({ color: 0xffaa00, linewidth: 2 })));

        // 6. Nakshatras Ring
        const nakshatras = ["अश्विनी", "भरणी", "कृत्तिका", "रोहिणी", "मृगशिरा", "आर्द्रा", "पुनर्वसु", "पुष्य", "आश्लेषा", "मघा", "पूर्वाफाल्गुनी", "उत्तराफाल्गुनी", "हस्त", "चित्रा", "स्वाती", "विशाखा", "अनुराधा", "ज्येष्ठा", "मूल", "पूर्वाषाढ़ा", "उत्तराषाढ़ा", "श्रवण", "धनिष्ठा", "शतभिषा", "पूर्वाभाद्रपद", "उत्तराभाद्रपद", "रेवती"];
        const nRadius = 34; const nHeight = 14;
        nakshatras.forEach((name, i) => {
            const angle = (i / 27) * Math.PI * 2;
            const star = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
            star.position.set(nRadius * Math.cos(angle), nHeight, nRadius * Math.sin(angle));
            scene.add(star);
        });

        // 7. Perspective Targeting Variables
        let currentCenterType = "geo"; // geo, sun, polaris

        // UI Target Sync Logic
        function syncClockAndMechanics() {
            const now = new Date();
            const hours = now.getHours(); const minutes = now.getMinutes(); const seconds = now.getSeconds();
            const totalSecondsInDay = (hours * 3600) + (minutes * 60) + seconds;
            
            const dayProgressAngle = (totalSecondsInDay / 86400) * 360;
            const sunAngleRad = ((dayProgressAngle - 90) * Math.PI) / 180;

            const start = new Date(now.getFullYear(), 0, 0);
            const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
            const yearProgressAngle = (dayOfYear / 365) * Math.PI * 2;

            document.getElementById('liveClock').innerText = `🕒 समय: ${now.toLocaleTimeString()}`;
            document.getElementById('ayanaState').innerText = (dayOfYear > 35 && dayOfYear < 218) ? "अयन: उत्तरायण" : "अयन: दक्षिणायन";

            // Update Surya Position
            const sunMesh = grahaMeshes["Surya"];
            sunMesh.position.x = layersConfig[0].r * Math.cos(sunAngleRad);
            sunMesh.position.z = layersConfig[0].r * Math.sin(sunAngleRad);
            sunMesh.position.y = layersConfig[0].h + 4.0 * Math.sin(yearProgressAngle);

            // Update other Planets
            layersConfig.forEach(cfg => {
                if(cfg.name !== "Surya") {
                    const mesh = grahaMeshes[cfg.name];
                    let speedFactor = (cfg.name === "Chandra") ? 13.3 : (cfg.name === "Budha") ? 1.2 : (cfg.name === "Mangal") ? 0.5 : (cfg.name === "Brihaspati") ? 0.08 : 0.03;
                    const planetaryRad = sunAngleRad * speedFactor;
                    mesh.position.x = cfg.r * Math.cos(planetaryRad);
                    mesh.position.z = cfg.r * Math.sin(planetaryRad);
                    mesh.position.y = cfg.h;
                }
            });

            // Update Chariot Mechanical Line
            axisGeom.setFromPoints([meruCenterNode, sunMesh.position, polaris.position]);

            // Text Outputs
            document.getElementById('angleLabel').innerText = `सूर्य कोण: ${Math.floor(dayProgressAngle)}° | वर्ष का दिन: ${dayOfYear}`;
            const nIdx = Math.floor((dayOfYear / 365) * 27) % 27;
            document.getElementById('nakshatraInfo').innerHTML = `🌟 सूर्य आज <b>${nakshatras[nIdx]}</b> नक्षत्र में है।`;

            // Dynamic Camera Target Tracking based on chosen Center
            if (currentCenterType === "geo") {
                controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.1); // Focus Earth center
            } else if (currentCenterType === "sun") {
                controls.target.lerp(sunMesh.position, 0.1); // Track moving Sun
            } else if (currentCenterType === "polaris") {
                controls.target.lerp(polaris.position, 0.1); // Focus top Polaris
            }
        }

        // 8. 2D HTML Label Mappings
        function updateHTMLLabels() {
            purisData.forEach(p => {
                const projV = p.mesh.position.clone().project(camera);
                const x = (projV.x * .5 + .5) * window.innerWidth;
                const y = (projV.y * -.5 + .5) * window.innerHeight;
                const el = document.getElementById(`label-${p.id}`);
                if(projV.z < 1) {
                    el.style.display = "block"; el.style.left = `${x}px`; el.style.top = `${y}px`;
                } else { el.style.display = "none"; }
            });
        }

        // 9. Centric Perspective Switch Buttons Event Listeners
        const btns = {
            geo: document.getElementById('btn-geo'),
            sun: document.getElementById('btn-sun'),
            polaris: document.getElementById('btn-polaris')
        };
        const textPerspective = document.getElementById('currentPerspective');

        function setPerspective(type, titleText) {
            currentCenterType = type;
            textPerspective.innerText = `दृष्टिकोण: ${titleText}`;
            Object.keys(btns).forEach(k => btns[k].classList.remove('active'));
            btns[type].classList.add('active');
        }

        btns.geo.addEventListener('click', () => setPerspective('geo', 'भू-केन्द्रित (Geocentric)'));
        btns.sun.addEventListener('click', () => setPerspective('sun', 'सूर्य-केन्द्रित (Sun-centric)'));
        btns.polaris.addEventListener('click', () => setPerspective('polaris', 'ध्रुव-केन्द्रित (Polaris-centric)'));

        // 10. Main Render Cycle
        function renderLoop() {
            requestAnimationFrame(renderLoop);
            syncClockAndMechanics();
            controls.update();
            updateHTMLLabels();
            renderer.render(scene, camera);
        }
        renderLoop();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
