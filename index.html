<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedic Cosmic Map Converter (Phase 13)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020208; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* Modern Aligned HUD UI Panel */
        #info {
            position: absolute; top: 15px; left: 15px; color: #fff;
            background: rgba(10, 10, 25, 0.8); backdrop-filter: blur(8px);
            padding: 15px; border-radius: 12px; border: 1px solid rgba(0, 255, 170, 0.3);
            font-size: 13px; max-width: 340px; pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        
        /* Fixed Control Panel with 2 Rows: Center Modality & Cam Angles */
        #controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 10, 25, 0.9); backdrop-filter: blur(10px);
            padding: 15px 20px; border-radius: 16px;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.2); border: 1px solid rgba(255, 165, 0, 0.4);
            color: white; width: 90%; max-width: 640px; text-align: center;
        }

        .btn-group { margin: 5px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .control-label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }

        .view-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 165, 0, 0.5);
            color: #ffa500; padding: 6px 14px; font-weight: bold; border-radius: 20px;
            cursor: pointer; transition: all 0.2s ease; font-size: 11px;
        }
        .view-btn.active {
            background: linear-gradient(45deg, #ffa500, #ff5500); color: black;
            border-color: #fff; box-shadow: 0 0 10px #ffa500;
        }
        .angle-btn { border-color: rgba(0, 255, 255, 0.5); color: #00ffff; }
        .angle-btn.active {
            background: linear-gradient(45deg, #00ffff, #0088ff); color: black;
            box-shadow: 0 0 10px #00ffff; border-color: #fff;
        }

        /* 3D Floating Labels */
        .dynamic-label {
            position: absolute; color: #ffcc00; font-weight: bold; font-size: 10px;
            background: rgba(5, 5, 15, 0.85); padding: 2px 5px; border-radius: 4px;
            border: 1px solid rgba(255, 204, 0, 0.4); pointer-events: none;
            display: none; white-space: nowrap; font-family: monospace;
        }
        .const-label { color: #00ffff; border-color: rgba(0, 255, 255, 0.4); font-size: 11px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info">
        <h3 style="margin: 0 0 5px 0; color: #00ffaa; font-size: 15px;">वैदिक ब्रह्मांडीय मानचित्र</h3>
        <p style="margin: 2px 0; color: #bbb;" id="display-mode">📍 व्यू मोड: भू-केन्द्रित (Top View)</p>
        <p id="liveClock" style="color: #ffa500; font-weight: bold; margin: 4px 0;"></p>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 6px 0;">
        <p id="nakshatraInfo" style="margin: 4px 0; font-size:12px;"></p>
        <p id="timezoneInfo" style="color: #ffaa00; margin: 4px 0; font-size:12px;"></p>
    </div>

    <div id="labels-container"></div>
    <div id="canvas-container"></div>

    <div id="controls">
        <div class="control-label">1. ब्रह्मांडीय केंद्र प्रणाली (System Center)</div>
        <div class="btn-group">
            <button id="system-geo" class="view-btn active">🌍 भू-केन्द्रित (Earth Center)</button>
            <button id="system-sun" class="view-btn">☀️ सूर्य-केन्द्रित (Sun Center)</button>
            <button id="system-polaris" class="view-btn">⭐ ध्रुव-केन्द्रित (Polaris Center)</button>
        </div>
        
        <div class="control-label" style="margin-top: 8px;">2. प्रेक्षण कोण एलाइनमेंट (Camera Angle)</div>
        <div class="btn-group">
            <button id="cam-top" class="view-btn angle-btn active">🎛️ TOP VIEW (मानचित्र)</button>
            <button id="cam-front" class="view-btn angle-btn">👁️ FRONT VIEW (सामने से)</button>
            <button id="cam-free" class="view-btn angle-btn">🔄 FREE 3D VIEW</button>
        </div>
    </div>

    <script>
        // 1. Core Scene Engine
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020208, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const labelsContainer = document.getElementById('labels-container');
        const trackingObjects = [];

        function createDOMTextLabel(id, text, isConstellation = false) {
            const div = document.createElement('div');
            div.id = `label-${id}`;
            div.className = `dynamic-label ${isConstellation ? 'const-label' : ''}`;
            div.innerText = text;
            labelsContainer.appendChild(div);
            return div;
        }

        // 2. High-Density Galactic Background
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPositions = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i+=3) {
            const r = 280 + Math.random() * 100;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starPositions[i] = r * Math.sin(phi) * Math.cos(theta);
            starPositions[i+1] = r * Math.sin(phi) * Math.sin(theta);
            starPositions[i+2] = r * Math.cos(phi);
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35 })));

        // 3. System Space Entities Root Anchor Groups
        const cosmicRootGroup = new THREE.Group(); // Everything moves relative to this system
        scene.add(cosmicRootGroup);

        const textureLoader = new THREE.TextureLoader();
        const earthTex = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
        const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(4.5, 32, 32), new THREE.MeshBasicMaterial({ map: earthTex }));
        earthMesh.rotation.y = Math.PI;
        cosmicRootGroup.add(earthMesh);
        trackingObjects.push({ mesh: earthMesh, dom: createDOMTextLabel('earth', 'पृथ्वी (Earth)') });

        // Polaris Top Center Anchor Node
        const polarisNode = new THREE.Mesh(new THREE.SphereGeometry(1.0, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        polarisNode.position.set(0, 50, 0);
        cosmicRootGroup.add(polarisNode);
        trackingObjects.push({ mesh: polarisNode, dom: createDOMTextLabel('polaris', '⭐ ध्रुव तारा (Polaris Center)') });

        // 4. Four Directional Horizon Puris Maps
        const purisRadius = 24;
        const purisData = [
            { id: "devdhani", name: "🌅 इंद्रपुरी (East)", pos: new THREE.Vector3(purisRadius, 0, 0), color: 0x00f3ff },
            { id: "samyamani", name: "🔴 संयमनी (South)", pos: new THREE.Vector3(0, 0, purisRadius), color: 0xff3333 },
            { id: "nimlochani", name: "🌇 निम्लोचनी (West)", pos: new THREE.Vector3(-purisRadius, 0, 0), color: 0x00ff55 },
            { id: "vibhavari", name: "🌙 विभावरी (North)", pos: new THREE.Vector3(0, 0, -purisRadius), color: 0xffaa00 }
        ];
        purisData.forEach(p => {
            const m = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshBasicMaterial({ color: p.color }));
            m.position.copy(p.pos);
            cosmicRootGroup.add(m);
            trackingObjects.push({ mesh: m, dom: createDOMTextLabel(p.id, p.name) });
        });

        // 5. Planets Hierarchical Definition
        const layersConfig = [
            { name: "सूर्य (Sun)", r: 24, h: 8, c: 0xffd700, size: 2.2, speedFreq: 1.0 },
            { name: "चन्द्र (Moon)", r: 28, h: 14, c: 0xe0e0e0, size: 1.1, speedFreq: 13.3 },
            { name: "बुध (Mercury)", r: 32, h: 20, c: 0x00ffcc, size: 0.6, speedFreq: 1.2 },
            { name: "मंगल (Mars)", r: 36, h: 25, c: 0xff5555, size: 0.8, speedFreq: 0.5 },
            { name: "बृहस्पति (Jupiter)", r: 40, h: 30, c: 0xffb700, size: 1.4, speedFreq: 0.083 },
            { name: "शनि (Saturn)", r: 44, h: 36, c: 0x9c27b0, size: 1.2, speedFreq: 0.033 }
        ];

        const planetaryMeshes = {};
        layersConfig.forEach(cfg => {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(cfg.size, 16, 16), new THREE.MeshBasicMaterial({ color: cfg.c }));
            cosmicRootGroup.add(mesh);
            planetaryMeshes[cfg.name] = mesh;
            trackingObjects.push({ mesh: mesh, dom: createDOMTextLabel(`graha-${cfg.name}`, cfg.name) });

            // Render Path Rings
            const ringPts = [];
            for(let i=0; i<=90; i++) {
                const th = (i/90) * Math.PI * 2;
                ringPts.push(new THREE.Vector3(cfg.r * Math.cos(th), cfg.h, cfg.r * Math.sin(th)));
            }
            const ring = new THREE.Line(new THREE.BufferGeometry().setFromPoints(ringPts), new THREE.LineBasicMaterial({ color: cfg.c, transparent: true, opacity: 0.15 }));
            cosmicRootGroup.add(ring);
        });

        // Chariot mechanical axis link line
        const axisLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.4 }));
        cosmicRootGroup.add(axisLine);

        // 6. Fixed Outer Constellations Array
        const nakshatras = ["अश्विनी", "भरणी", "कृत्तिका", "रोहिणी", "मृगशिरा", "आर्द्रा", "पुनर्वसु", "पुष्य", "आश्लेषा", "मघा", "पूर्वाफाल्गुनी", "उत्तराफाल्गुनी", "हस्त", "चित्रा", "स्वाती", "विशाखा", "अनुराधा", "ज्येष्ठा", "मूल", "पूर्वाषाढ़ा", "उत्तराषाढ़ा", "श्रवण", "धनिष्ठा", "शतभिषा", "पूर्वाभाद्रपद", "उत्तराभाद्रपद", "रेवती"];
        const nRadius = 52; const nHeight = 16;
        nakshatras.forEach((name, i) => {
            const angle = (i / 27) * Math.PI * 2;
            const star = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
            star.position.set(nRadius * Math.cos(angle), nHeight, nRadius * Math.sin(angle));
            cosmicRootGroup.add(star);
            if(i % 2 === 0) trackingObjects.push({ mesh: star, dom: createDOMTextLabel(`nak-${i}`, name) });
        });

        // Add Major Constellations Structures
        function addGlowConst(name, pivot, offsets) {
            const g = new THREE.Group(); const pts = [new THREE.Vector3(0,0,0)];
            const anchor = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            g.add(anchor);
            offsets.forEach(o => {
                const n = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                n.position.copy(o); g.add(n); pts.push(o);
            });
            g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x00e1ff, transparent: true, opacity: 0.4 })));
            g.position.copy(pivot); cosmicRootGroup.add(g);
            trackingObjects.push({ mesh: anchor, dom: createDOMTextLabel(name, name, true), isGroupChild: true });
        }
        addGlowConst("सप्तर्षि (Ursa Major)", new THREE.Vector3(-35, 45, -40), [new THREE.Vector3(4,2,0), new THREE.Vector3(8,1,2), new THREE.Vector3(12,-2,1)]);
        addGlowConst("कालपुरुष (Orion)", new THREE.Vector3(-45, 12, 45), [new THREE.Vector3(0,6,0), new THREE.Vector3(4,4,-2), new THREE.Vector3(3,-2,2)]);
        addGlowConst("सिंह (Leo)", new THREE.Vector3(45, 30, -35), [new THREE.Vector3(-3,3,1), new THREE.Vector3(3,4,0), new THREE.Vector3(5,1,-2)]);

        // 7. Core Converters & Mathematical Camera Alignment Logic
        let selectedCenterSystem = "geo"; // geo, sun, polaris
        let currentCamAngleState = "top"; // top, front, free
        const currentTargetPos = new THREE.Vector3(0,0,0);

        function updateCosmicCalculations() {
            const now = new Date();
            const secProgress = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
            const baseAngleRad = (((secProgress / 86400) * 360 - 90) * Math.PI) / 180;

            const start = new Date(now.getFullYear(), 0, 0);
            const totalDaysIndex = Math.floor((now - start) / (1000 * 60 * 60 * 24));
            const yearRad = (totalDaysIndex / 365) * Math.PI * 2;

            document.getElementById('liveClock').innerText = `🕒 समय: ${now.toLocaleTimeString()} IST | तारीख: ${now.toLocaleDateString('hi-IN')}`;

            // Process dynamic orbits
            layersConfig.forEach(cfg => {
                const mesh = planetaryMeshes[cfg.name];
                const activeRad = baseAngleRad * cfg.speedFreq;
                mesh.position.x = cfg.r * Math.cos(activeRad);
                mesh.position.z = cfg.r * Math.sin(activeRad);
                mesh.position.y = (cfg.name === "सूर्य (Sun)") ? (cfg.h + 5.0 * Math.sin(yearRad)) : cfg.h;
            });

            // Re-render mechanical links
            const sunPos = planetaryMeshes["सूर्य (Sun)"].position;
            axisLine.geometry.setFromPoints([new THREE.Vector3(0, 4.5, 0), sunPos, polarisNode.position]);

            const currentNakIdx = Math.floor((totalDaysIndex / 365) * 27) % 27;
            document.getElementById('nakshatraInfo').innerHTML = `🌌 सूर्य गोचर नक्षत्र: <b style="color:#00ffff;">${nakshatras[currentNakIdx]}</b>`;

            // Active System Mode Shift Handler (True Geocentric vs Heliocentric Inverse Translation)
            if (selectedCenterSystem === "geo") {
                cosmicRootGroup.position.set(0, 0, 0); // Earth stays dead-center at (0,0,0)
                currentTargetPos.set(0, 0, 0);
            } else if (selectedCenterSystem === "sun") {
                // To keep Sun at center of the viewport, shift the whole universe group inversely
                cosmicRootGroup.position.set(-sunPos.x, -sunPos.y, -sunPos.z);
                currentTargetPos.set(0, 0, 0); // Viewport focus remains fixed at world center
            } else if (selectedCenterSystem === "polaris") {
                cosmicRootGroup.position.set(0, -polarisNode.position.y, 0); // Slide everything down to lock Polaris at center
                currentTargetPos.set(0, 0, 0);
            }

            // Fixed Angle Formulations (Overriding controls to enforce strict alignment checks)
            if (currentCamAngleState === "top") {
                // Top-Down orthographic alignment simulation
                camera.position.lerp(new THREE.Vector3(0, 110, 0.01), 0.08); // Perfect Y-axis view looking down
                camera.up.lerp(new THREE.Vector3(0, 0, -1), 0.08);          // Enforce 0° North facing layout
                controls.target.lerp(currentTargetPos, 0.08);
                controls.enableRotate = false; // Disable finger rotation in fixed map modes to preserve lock
            } else if (currentCamAngleState === "front") {
                // Front elevation tracking profile
                camera.position.lerp(new THREE.Vector3(0, 5, 105), 0.08);   // Flat horizontal profile plane
                camera.up.lerp(new THREE.Vector3(0, 1, 0), 0.08);
                controls.target.lerp(currentTargetPos, 0.08);
                controls.enableRotate = false;
            } else if (currentCamAngleState === "free") {
                controls.enableRotate = true; // Unlock trackball mapping for custom rotations
                controls.target.lerp(currentTargetPos, 0.05);
            }
        }

        // 8. Matrix Vector Projector Handler
        const tempV = new THREE.Vector3();
        function projectFloatingLabels() {
            trackingObjects.forEach(obj => {
                if (obj.isGroupChild) { obj.mesh.getWorldPosition(tempV); } 
                else { tempV.copy(obj.mesh.position).add(cosmicRootGroup.position); }
                
                tempV.project(camera);
                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;
                
                // Active clipping plane validation
                if(tempV.z < 1 && x >= 0 && x <= window.innerWidth && y >= 0 && y <= window.innerHeight && currentCamAngleState !== "front") {
                    obj.dom.style.display = "block"; obj.dom.style.left = `${x}px`; obj.dom.style.top = `${y}px`;
                } else { obj.dom.style.display = "none"; }
            });
        }

        // 9. Interactive Systems UI Controls Mapping
        const sysBtns = { geo: document.getElementById('system-geo'), sun: document.getElementById('system-sun'), polaris: document.getElementById('system-polaris') };
        const camBtns = { top: document.getElementById('cam-top'), front: document.getElementById('cam-front'), free: document.getElementById('cam-free') };

        function setSystemCenter(sys) {
            selectedCenterSystem = sys;
            Object.keys(sysBtns).forEach(k => sysBtns[k].classList.remove('active'));
            sysBtns[sys].classList.add('active');
            document.getElementById('display-mode').innerText = `📍 व्यू मोड: ${sys==='geo'?'भू-केन्द्रित':sys==='sun'?'सूर्य-केन्द्रित':'ध्रुव-केन्द्रित'} (${currentCamAngleState.toUpperCase()} VIEW)`;
        }

        function setCamAngle(ang) {
            currentCamAngleState = ang;
            Object.keys(camBtns).forEach(k => camBtns[k].classList.remove('active'));
            camBtns[ang].classList.add('active');
            if(ang === "free") camera.position.set(20, 60, 90); // Pop camera out to an oblique view
            setSystemCenter(selectedCenterSystem);
        }

        sysBtns.geo.addEventListener('click', () => setSystemCenter('geo'));
        sysBtns.sun.addEventListener('click', () => setSystemCenter('sun'));
        sysBtns.polaris.addEventListener('click', () => setSystemCenter('polaris'));

        camBtns.top.addEventListener('click', () => setCamAngle('top'));
        camBtns.front.addEventListener('click', () => setCamAngle('front'));
        camBtns.free.addEventListener('click', () => setCamAngle('free'));

        // 10. Frame Ticker Execution
        function runMatrixTick() {
            requestAnimationFrame(runMatrixTick);
            updateCosmicCalculations();
            earthMesh.rotation.y += 0.0005;
            controls.update();
            projectFloatingLabels();
            renderer.render(scene, camera);
        }
        runMatrixTick();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
