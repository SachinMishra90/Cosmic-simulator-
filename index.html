<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedic Cosmic Simulator (Phase 4 - Map Sync)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); padding: 15px 25px; border-radius: 10px;
            box-shadow: 0 0 15px rgba(255,165,0,0.5); border: 1px solid #ffa500;
            color: white; width: 80%; max-width: 600px; text-align: center;
        }
        input[type=range] { width: 100%; margin-top: 10px; accent-color: #ffa500; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #fff;
            background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; border-left: 3px solid #ffa500;
            font-size: 13px; max-width: 320px; pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info">
        <h3>वैदिक कॉस्मिक सिमुलेटर (फेज 4)</h3>
        <p>🗺️ **भौगोलिक मानचित्र सिंक:** वास्तविक 3D ग्लोब एक्टिवेटेड। ध्रुव अक्ष और शिशुमार का पृथ्वी से कनेक्शन देखें।</p>
        <p id="nakshatraInfo">गणना चालू...</p>
    </div>

    <div id="canvas-container"></div>

    <div id="controls">
        <label id="timeLabel">काल चक्र (सूर्य का कोण): 0°</label>
        <input type="range" id="timeSlider" min="0" max="360" value="0">
    </div>

    <script>
        // 1. सीन और कैमरा सेटअप
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        camera.position.set(0, 20, 40);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // 2. आकाशीय तारे (Background Stars)
        const starsGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(2000 * 3);
        for(let i=0; i<2000*3; i++) starPositions[i] = (Math.random() - 0.5) * 250;
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        scene.add(new THREE.Points(starsGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35 })));

        // 3. वास्तविक 3D ग्लोब (Textured Earth)
        const earthRadius = 5;
        const textureLoader = new THREE.TextureLoader();
        // ओपन-सोर्स हाई-क्वालिटी अर्थ मैप टेक्सचर
        const earthTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
        
        const earthGeometry = new THREE.SphereGeometry(earthRadius, 64, 64);
        const earthMaterial = new THREE.MeshBasicMaterial({ map: earthTexture });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        // पृथ्वी को वैदिक भूगोल के अनुसार थोड़ा सा अलाइन करना
        earth.rotation.y = Math.PI; 
        scene.add(earth);

        // ध्रुव अक्ष लाइन (Cosmic Axis passing through center)
        const axisPoints = [new THREE.Vector3(0, -15, 0), new THREE.Vector3(0, 22, 0)];
        scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(axisPoints), new THREE.LineBasicMaterial({ color: 0x666666 })));

        // ध्रुव तारा (Polaris)
        const polaris = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        polaris.position.set(0, 20, 0);
        scene.add(polaris);

        // 4. सूर्य और चंद्रमा
        const sun = new THREE.Mesh(new THREE.SphereGeometry(1.4, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
        const moon = new THREE.Mesh(new THREE.SphereGeometry(0.65, 32, 32), new THREE.MeshBasicMaterial({ color: 0xdddddd }));
        scene.add(sun, moon);

        // 5. 27 नक्षत्र चक्र
        const beltRadius = 22;
        const nakshatras = [
            "अश्विनी", "भरणी", "कृत्तिका", "रोहिणी", "मृगशिरा", "आर्द्रा", "पुनर्वसु", "पुष्य", "आश्लेषा",
            "मघा", "पूर्वाफाल्गुनी", "उत्तराफाल्गुनी", "हस्त", "चित्रा", "स्वाती", "विशाखा", "अनुराधा", "ज्येष्ठा",
            "मूल", "पूर्वाषाढ़ा", "उत्तराषाढ़ा", "श्रवण", "धनिष्ठा", "शतभिषा", "पूर्वाभाद्रपद", "उत्तराभाद्रपद", "रेवती"
        ];

        const ringGeometry = new THREE.RingGeometry(beltRadius - 0.05, beltRadius + 0.05, 64);
        const nakshatraRing = new THREE.Mesh(ringGeometry, new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.DoubleSide }));
        nakshatraRing.rotation.x = Math.PI / 2;
        scene.add(nakshatraRing);

        const nakshatraPositions = [];
        nakshatras.forEach((name, i) => {
            const angle = (i / 27) * Math.PI * 2;
            const x = beltRadius * Math.cos(angle);
            const z = beltRadius * Math.sin(angle);
            nakshatraPositions.push(new THREE.Vector3(x, 0, z));

            const nStar = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
            nStar.position.set(x, 0, z);
            scene.add(nStar);
        });

        // 6. शिशुमार नक्षत्र-जाल (Shishumara Grid Lines)
        const shishumaraGroup = new THREE.Group();
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffaa, transparent: true, opacity: 0.5 });

        const tailNode1 = new THREE.Vector3(0, 14, 0);
        const bodyNodeLeft = new THREE.Vector3(-7, 6, 7);
        const bodyNodeRight = new THREE.Vector3(7, 6, -7);

        const structurePoints = [
            [polaris.position, tailNode1],
            [tailNode1, bodyNodeLeft],
            [tailNode1, bodyNodeRight],
            [bodyNodeLeft, nakshatraPositions[0]],
            [bodyNodeRight, nakshatraPositions[13]],
            [bodyNodeLeft, nakshatraPositions[18]],
            [bodyNodeRight, nakshatraPositions[9]]
        ];

        structurePoints.forEach(pair => {
            shishumaraGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pair), lineMat));
        });
        scene.add(shishumaraGroup);

        // 7. इंटरएक्टिव मोशन इंजन
        const slider = document.getElementById('timeSlider');
        const label = document.getElementById('timeLabel');
        const nakshatraInfo = document.getElementById('nakshatraInfo');

        function updatePositions(degrees) {
            const radians = (degrees * Math.PI) / 180;
            
            // सूर्य की परिक्रमा (Inclined Orbit)
            sun.position.x = beltRadius * Math.cos(radians);
            sun.position.z = beltRadius * Math.sin(radians);
            sun.position.y = 5 * Math.sin(radians); 

            // चंद्रमा की परिक्रमा (Lunar Ratio ~13.36)
            const moonRadius = 14;
            const moonRadians = radians * 13.36;
            moon.position.x = moonRadius * Math.cos(moonRadians);
            moon.position.z = moonRadius * Math.sin(moonRadians);
            moon.position.y = 3 * Math.cos(moonRadians);

            // शिशुमार चक्र का घूर्णन
            shishumaraGroup.rotation.y = radians * 0.08;

            const nakshatraIndex = Math.floor((degrees / 360) * 27) % 27;
            const currentNakshatra = nakshatras[nakshatraIndex];

            label.innerText = `काल चक्र (सूर्य का कोण): ${degrees}°`;
            nakshatraInfo.innerHTML = `🌞 सूर्य अभी <b>${currentNakshatra}</b> नक्षत्र में है।`;
        }

        updatePositions(0);

        slider.addEventListener('input', (e) => {
            updatePositions(e.target.value);
        });

        // 8. एनीमेशन लूप
        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.0015; // पृथ्वी का वास्तविक गति से धीमा घूमना
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
