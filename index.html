<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedic Cosmic Simulator (Phase 5 - Puranic Planetary Layers)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); padding: 15px 25px; border-radius: 10px;
            box-shadow: 0 0 15px rgba(255,165,0,0.5); border: 1px solid #ffa500;
            color: white; width: 80%; max-width: 600px; text-align: center;
        }
        input[type=range] { width: 100%; margin-top: 10px; accent-color: #ffa500; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #fff;
            background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; border-left: 3px solid #ffa500;
            font-size: 13px; max-width: 340px; pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info">
        <h3>वैदिक कॉस्मिक सिमुलेटर (फेज 5)</h3>
        <p>📜 **भागवत पुराण स्कंध 5 ऑडिट:** सभी 7 मुख्य ग्रह, नक्षत्र बेल्ट और सप्तर्षि मंडल अपनी शास्त्र-सम्मत ऊंचाई (Yojana Ratio) पर स्थापित हैं।</p>
        <p id="nakshatraInfo">गणना चालू...</p>
    </div>

    <div id="canvas-container"></div>

    <div id="controls">
        <label id="timeLabel">काल चक्र (सूर्य का कोण): 0°</label>
        <input type="range" id="timeSlider" min="0" max="360" value="0">
    </div>

    <script>
        // 1. Scene & Camera Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        camera.position.set(0, 35, 55);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // 2. Background Stars (Starfield)
        const starsGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(3000 * 3);
        for(let i=0; i<3000*3; i++) starPositions[i] = (Math.random() - 0.5) * 300;
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        scene.add(new THREE.Points(starsGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35 })));

        // 3. Central Geographic 3D Globe
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
        const earth = new THREE.Mesh(new THREE.SphereGeometry(4, 64, 64), new THREE.MeshBasicMaterial({ map: earthTexture }));
        earth.rotation.y = Math.PI; 
        scene.add(earth);

        // Dhruva Axial Line (Meru Axis)
        const axisPoints = [new THREE.Vector3(0, -25, 0), new THREE.Vector3(0, 35, 0)];
        scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(axisPoints), new THREE.LineBasicMaterial({ color: 0x444444 })));

        // Dhruva Tara (Polaris) - Top Anchor at Y: 32
        const polaris = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        polaris.position.set(0, 32, 0);
        scene.add(polaris);

        // 4. Puranic Orbits Data Array (Height Y and Speed Ratio based on Shrimad Bhagavat)
        // Scaling: 100,000 Yojanas = ~2.5 units in 3D Space
        const planetData = [
            { name: "सूर्य (Sun)", radius: 14, height: 2.5, color: 0xffaa00, size: 1.2, speedMult: 1 },
            { name: "चंद्रमा (Moon)", radius: 15, height: 5.0, color: 0xdddddd, size: 0.6, speedMult: 13.36 },
            { name: "शुक्र (Venus)", radius: 16, height: 8.5, color: 0xfffdd0, size: 0.45, speedMult: 1.2 },
            { name: "बुध (Mercury)", radius: 17, height: 11.0, color: 0x888888, size: 0.4, speedMult: 1.5 },
            { name: "मंगल (Mars)", radius: 18, height: 13.5, color: 0xff3333, size: 0.5, speedMult: 0.5 },
            { name: "बृहस्पति (Jupiter)", radius: 19, height: 16.0, color: 0xffaa66, size: 0.8, speedMult: 0.08 },
            { name: "शनि (Saturn)", radius: 20, height: 18.5, color: 0xffee99, size: 0.7, speedMult: 0.03 },
            { name: "सप्तर्षि (Ursa Major)", radius: 22, height: 23.5, color: 0xffffff, size: 0.2, isCluster: true }
        ];

        const planetMeshes = [];

        // Building the Multi-Layer Grid System
        planetData.forEach((p) => {
            // Draw Orbit Ring
            const ringGeo = new THREE.RingGeometry(p.radius - 0.04, p.radius + 0.04, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.DoubleSide });
            const orbitRing = new THREE.Mesh(ringGeo, ringMat);
            orbitRing.rotation.x = Math.PI / 2;
            orbitRing.position.y = p.height;
            scene.add(orbitRing);

            if (p.isCluster) {
                // Saptarishi Mandal (7 Stars Node Group)
                const saptarishiGroup = new THREE.Group();
                saptarishiGroup.position.y = p.height;
                for(let i = 0; i < 7; i++) {
                    const ang = (i / 7) * 0.4; // Clustered together like a ladle
                    const star = new THREE.Mesh(new THREE.SphereGeometry(p.size, 8, 8), new THREE.MeshBasicMaterial({ color: p.color }));
                    star.position.set(p.radius * Math.cos(ang), 0, p.radius * Math.sin(ang));
                    saptarishiGroup.add(star);
                }
                scene.add(saptarishiGroup);
                planetMeshes.push({ mesh: saptarishiGroup, data: p });
            } else {
                // Standard Planets
                const geom = new THREE.SphereGeometry(p.size, 32, 32);
                const mat = new THREE.MeshBasicMaterial({ color: p.color });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.position.y = p.height;
                scene.add(mesh);
                planetMeshes.push({ mesh: mesh, data: p });
            }
        });

        // 5. 27 Nakshatra Belt (Placed exactly between Moon and Venus orbit heights at Y: 6.5)
        const nakshatras = [
            "अश्विनी", "भरणी", "कृत्तिका", "रोहिणी", "मृगशिरा", "आर्द्रा", "पुनर्वसु", "पुष्य", "आश्लेषा",
            "मघा", "पूर्वाफाल्गुनी", "उत्तराफाल्गुनी", "हस्त", "चित्रा", "स्वाती", "विशाखा", "अनुराधा", "ज्येष्ठा",
            "मूल", "पूर्वाषाढ़ा", "उत्तराषाढ़ा", "श्रवण", "धनिष्ठा", "शतभिषा", "पूर्वाभाद्रपद", "उत्तराभाद्रपद", "रेवती"
        ];
        const nakshatraRadius = 24;
        const nakshatraHeight = 6.5;
        const nakshatraPositions = [];

        nakshatras.forEach((name, i) => {
            const angle = (i / 27) * Math.PI * 2;
            const x = nakshatraRadius * Math.cos(angle);
            const z = nakshatraRadius * Math.sin(angle);
            nakshatraPositions.push(new THREE.Vector3(x, nakshatraHeight, z));

            const nStar = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
            nStar.position.set(x, nakshatraHeight, z);
            scene.add(nStar);
        });

        // 6. Shishumara Constellation Framework (Neon structure holding the cosmic wheel)
        const shishumaraGroup = new THREE.Group();
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffaa, transparent: true, opacity: 0.45 });
        const tailNode = new THREE.Vector3(0, 26, 0);

        const structurePoints = [
            [polaris.position, tailNode],
            [tailNode, nakshatraPositions[0]],     // Connected to Ashwini
            [tailNode, nakshatraPositions[9]],     // Connected to Magha
            [tailNode, nakshatraPositions[18]]     // Connected to Mula
        ];

        structurePoints.forEach(pair => {
            shishumaraGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pair), lineMat));
        });
        scene.add(shishumaraGroup);

        // 7. Interactive Slider & Motion Engine
        const slider = document.getElementById('timeSlider');
        const label = document.getElementById('timeLabel');
        const nakshatraInfo = document.getElementById('nakshatraInfo');

        function updatePositions(degrees) {
            const radians = (degrees * Math.PI) / 180;
            
            // Move Each Planet according to Puranic Speed Ratios
            planetMeshes.forEach((pObj) => {
                const p = pObj.data;
                const m = pObj.mesh;
                
                if (p.isCluster) {
                    // Saptarishi rotation (Slow cosmic movement)
                    m.rotation.y = radians * 0.05;
                } else {
                    const currentRad = radians * p.speedMult;
                    m.position.x = p.radius * Math.cos(currentRad);
                    m.position.z = p.radius * Math.sin(currentRad);
                    
                    // Giving Sun an inclination wave for Uttarayan/Dakshinayan
                    if(p.name.includes("सूर्य")) {
                        m.position.y = p.height + 3 * Math.sin(currentRad);
                    }
                }
            });

            // Shishumara framework rotation (The Mahakala rotation of 24h)
            shishumaraGroup.rotation.y = radians * 0.1;

            // Tracking the current Nakshatra
            const nakshatraIndex = Math.floor((degrees / 360) * 27) % 27;
            const currentNakshatra = nakshatras[nakshatraIndex];

            label.innerText = `काल चक्र (सूर्य का कोण): ${degrees}°`;
            nakshatraInfo.innerHTML = `🌞 सूर्य अभी <b>${currentNakshatra}</b> नक्षत्र में है।`;
        }

        updatePositions(0);
        slider.addEventListener('input', (e) => updatePositions(e.target.value));

        // 8. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.001; // Slow axial rotation of the Earth map
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
